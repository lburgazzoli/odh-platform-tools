version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - copyloopvar
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - whitespace
  exclusions:
    rules:
      # Tests dot-import Gomega for matchers by project convention.
      - path: _test\.go
        text: "should not use dot imports"

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
