# End-to-end pipeline for a real third-party module operator: it checks
# out opendatahub-io/feast-module-operator, builds its controller image
# and pushes it to ttl.sh — an anonymous ephemeral registry: no
# credentials, and the image vanishes after the TTL carried in the tag
# (here one hour) — then drives the full module workflow (generate,
# lint, deploy, validate) against a throwaway Kind cluster whose nodes
# pull the image directly from ttl.sh.
#
# This repository is never checked out: the tools run go-run style from
# their module path on GitHub, exactly as an external module author
# would consume them. The dispatch inputs pin either side for a
# debugging run. kubectl comes preinstalled on the runner.
#
# Platform contract notes encoded below, learned from a live run of
# this exact flow:
#   - the module name is "data": opendatahub-operator registers the
#     feast module under that name, and the module reads its
#     platformVersion from the odh-<module>-config ConfigMap the name
#     derives (odh-data-config), not from the CRD kind;
#   - the prometheus operator CRDs must be installed before the module
#     deploys: the module controller watches ServiceMonitors
#     unconditionally, and without the CRD its informer never syncs,
#     so the controller runs but reconciles nothing (the operator
#     itself is not needed — nothing consumes the monitors here);
#   - the chart renders no Namespace (the platform owns namespaces),
#     so the target namespace is created up front and passed as the
#     chart's "namespace" value, which its NetworkPolicy templates
#     require (they have no .Release.Namespace fallback);
#   - the FeastOperator CRD mandates the "default-feastoperator"
#     singleton instance name (XValidation), so generate is given
#     --instance-name to record it.
#
# The run is manual-only (workflow_dispatch); enable the commented
# triggers to run it on changes.

name: module pipeline

on:
  workflow_dispatch:
    inputs:
      module-ref:
        description: "feast-module-operator git ref to check out"
        default: main
        type: string
  # push:
  #   branches: [main]

permissions:
  contents: read

env:
  # Kind runs go-run style like the module commands; $KIND must stay
  # unquoted so the invocation splits into words. Pinning the version
  # also fixes the default node image (kindest/node v1.37.0,
  # digest-pinned by kind itself). The provider selection is a plain
  # environment variable kind reads, so it lives here instead of a
  # per-command prefix.
  KIND: go run sigs.k8s.io/kind@v0.33.0
  KIND_EXPERIMENTAL_PROVIDER: podman
  # The tools run from their module path on GitHub, so the pipeline
  # exercises the published tooling; $ODH_CLI must stay unquoted so the
  # invocation splits into words.
  ODH_CLI: go run github.com/lburgazzoli/odh-platform-tools/cmd@main

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLUSTER: module-pipeline
      NAMESPACE: opendatahub-feast-system
      MODULE: feast-module-operator
      CONFIG: .generated/module.yaml
      RELATED_IMAGES: .generated/related-images.yaml
      # An explicit kubeconfig keeps the tools and kubectl on the same
      # cluster regardless of any default kubeconfig on the runner.
      # Kind selects the new cluster's context when it writes this
      # file, so no --kubeconfig or --context flags are needed.
      KUBECONFIG: ${{ github.workspace }}/.kind/kubeconfig
    steps:
      - name: Check out the module operator
        uses: actions/checkout@v4
        with:
          repository: opendatahub-io/feast-module-operator
          ref: ${{ github.event.inputs.module-ref || 'main' }}
          path: feast-module-operator

      - name: Set up Go
        # stable satisfies both sides: the tools module requires a
        # newer Go line than the module operator's go.mod pins, and the
        # same toolchain compiles the go-run tools fetch.
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Resolve the image reference
        run: |
          # A random UUID keeps concurrent runs from sharing a ttl.sh
          # reference; the :1h tag is the TTL. IMAGE is written once
          # and reused by the build and the definition values, so they
          # cannot drift apart. The UUID is lowercased because image
          # names must be (macOS uuidgen prints uppercase; Linux
          # already lowercase).
          id="$(uuidgen | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_ID=$id" >> "$GITHUB_ENV"
          echo "IMAGE=ttl.sh/$id:1h" >> "$GITHUB_ENV"

      - name: Build and push the module operator image
        run: |
          # The module operator's own Makefile builds its Containerfile;
          # podman is preinstalled on the runner. Its bundled upstream
          # manifests are git-tracked, so the container-prep hook skips
          # the feast manifests fetch and only regenerates code.
          make -C "$MODULE" container-build \
            CONTAINER_TOOL=podman \
            IMG="$IMAGE"
          make -C "$MODULE" container-push \
            CONTAINER_TOOL=podman \
            IMG="$IMAGE"

      - name: Create the Kind cluster
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          $KIND create cluster \
            --name "$CLUSTER"

      - name: Install the prometheus operator CRDs
        run: |
          # Prerequisite, not convenience: the module controller
          # watches ServiceMonitors unconditionally, and without the
          # CRD its informer never syncs — the controller runs but
          # reconciles nothing. Nothing consumes the monitors in this
          # pipeline, so the operator itself is not installed: only
          # its CRDs, from the release's stripped-down asset. Applied
          # server-side because the CRDs are too large for
          # client-side apply.
          kubectl apply --server-side \
            --filename https://github.com/prometheus-operator/prometheus-operator/releases/download/v0.95.2/stripped-down-crds.yaml
          kubectl wait --for=condition=Established \
            crd/servicemonitors.monitoring.coreos.com --timeout=60s

      - name: Create the target namespace
        run: |
          # The chart renders no Namespace — the platform owns
          # namespaces — and the deployer requires the target to exist.
          kubectl create namespace "$NAMESPACE"

      - name: Write the related images file
        run: |
          # The names are exactly the ones opendatahub-operator's data
          # module handler injects for this module (RelatedImages):
          # the two operand images its operator deploys. The module
          # operator's own image is not a related image — it is the
          # controller image, passed to the chart at generate time.
          # The values are the platform's digest-pinned ODH
          # references; the kube-rbac-proxy image in the operator's
          # internal map is not listed: the handler does not inject
          # it for this module.
          mkdir -p "$(dirname "$RELATED_IMAGES")"
          cat > "$RELATED_IMAGES" <<EOF
          relatedImages:
            - name: RELATED_IMAGE_ODH_FEAST_OPERATOR_IMAGE
              value: quay.io/opendatahub/feast-operator@sha256:0d821aeaadcd326c1320fa4f81ab8a4b05706dac9bac9c6f03dd4098fe22f4a6
            - name: RELATED_IMAGE_ODH_FEATURE_SERVER_IMAGE
              value: quay.io/opendatahub/feature-server@sha256:98672911c37cad76859d38c5ec3c8c26f62147bccaea33f2b4dfb7c50b2f0d40
          EOF

      - name: Generate the module definition
        run: |
          # --name data is the platform module name registered by
          # opendatahub-operator for this operator, not the CRD kind:
          # the module reads its platformVersion from the
          # odh-<module>-config ConfigMap the name derives
          # (odh-data-config). --init-container names the init
          # container the chart's Deployment carries. The namespace
          # value is the chart's contract with the platform. The image
          # value is the operator's own image — the controller image,
          # not a related image. The related-images file contributes
          # the operand image names the module operator consumes as
          # RELATED_IMAGE_* env vars. The instance name is the
          # "default-feastoperator" singleton the FeastOperator CRD
          # mandates; the default would derive it from the module
          # name ("data").
          mkdir -p "$(dirname "$CONFIG")"
          $ODH_CLI module generate "$MODULE/config/chart" \
            --name data \
            --instance-name default-feastoperator \
            --init-container copy-manifests \
            --values "image.fullRef=$IMAGE" \
            --values "namespace=$NAMESPACE" \
            --related-images-file "$RELATED_IMAGES" \
            --output "$CONFIG"

      - name: Lint the definition
        run: |
          $ODH_CLI module lint \
            --config "$CONFIG"

      - name: Deploy the controller package
        run: |
          # The related-images file resolves the controller image
          # token and the operand images injected as env vars on the
          # module operator Deployment.
          $ODH_CLI module deploy \
            --config "$CONFIG" \
            --related-images-file "$RELATED_IMAGES" \
            --platform-version 3.5.0 \
            --namespace "$NAMESPACE" \
            --wait

      - name: Apply the module instance
        run: |
          kubectl apply \
            --filename "$MODULE/config/samples/components_v1alpha1_feastoperator.yaml"

      - name: Validate the running module
        run: |
          # --timeout raises the overall validation budget for a cold
          # CI cluster; the default is 30s.
          $ODH_CLI module validate \
            --config "$CONFIG" \
            --namespace "$NAMESPACE" \
            --timeout 120s

      - name: Delete the Kind cluster
        run: |
          $KIND delete cluster \
            --name "$CLUSTER"
