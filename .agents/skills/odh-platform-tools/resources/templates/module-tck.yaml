# GitHub Actions workflow template for the OpenDataHub platform module
# TCK. Copy it into your module repository as
# .github/workflows/module-tck.yaml and fill in the REQUIRED values in
# the env block below.
#
# Manual dispatch drives the full sequence: generate a fresh
# definition, lint it offline, deploy the controller package on a
# disposable Kind cluster, apply the module instance separately,
# validate read-only, and delete the cluster.
#
# Trust note: the live steps execute your module's controller code on
# the Kind cluster. Kind is a development tool, not a security
# sandbox, and passing lint says nothing about trustworthiness — run
# it on reviewed source and images only.

name: module TCK

on:
  workflow_dispatch:
  # To also run the offline gate (generate + lint) on pull requests,
  # add the trigger and gate every step from "Create the Kind
  # cluster" down with:
  #   if: github.event_name == 'workflow_dispatch'
  # A pull_request event can never satisfy that gate, so PR runs
  # stay offline: no cluster, no secrets, fork-safe.

permissions:
  contents: read

env:
  # Tools ref: main while the tools are iterating with no releases.
  # Once releases exist, pin a tag or commit — a moving ref makes CI
  # results and failure reports irreproducible.
  ODH_TOOLS_REF: "main"

  # Go version satisfying the tools ref's Go requirement
  # (`go list -m -json github.com/lburgazzoli/odh-platform-tools@<ref>`
  # reports it) and the Kind pin's.
  GO_VERSION: "1.27"

  # REQUIRED: helm or kustomize — the backend of MODULE_SOURCE.
  MANIFEST_FORMAT: "helm"

  # REQUIRED: module source directory relative to the repository
  # root; "." when the chart or Kustomize tree is the repo root.
  # The checkout lands under source/, so the generated definition
  # always sits beside — never inside — the chart.
  MODULE_SOURCE: "config/chart"

  # REQUIRED for manual runs: target platform semantic version,
  # target namespace (created by this workflow), and the module
  # instance manifest, applied separately after deploy.
  PLATFORM_VERSION: "3.5.0"
  NAMESPACE: "my-module-system"
  INSTANCE_MANIFEST: "config/samples/instance.yaml"

  # Optional: related images YAML (name and value entries), relative
  # to the repo root. Generation copies only the names into the
  # definition; deploy resolves the current values from the same
  # file. Leave empty when the module declares no related images.
  RELATED_IMAGES_FILE: "related-images.yaml"

  # Optional overrides: module name (when the platform registers the
  # module under a name other than the CRD kind), instance name (for
  # CRDs mandating a singleton name), and init container (required
  # whenever the rendered Deployment has init containers).
  MODULE_NAME: ""
  INSTANCE_NAME: ""
  INIT_CONTAINER: ""

  # Optional (Helm only): values file loaded first, then ordered set
  # expressions, one per line — later lines override earlier ones.
  # The controller image is set here (or already in the tree for
  # Kustomize); operand images belong in RELATED_IMAGES_FILE.
  HELM_VALUES_FILE: ""
  HELM_SETS: |-
    image.fullRef=quay.io/example/example-controller:v1.0.0

  # Pinned Kind version this template was reviewed against.
  KIND_REF: "v0.33.0"

jobs:
  tck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLUSTER: module-tck
      # Run-local kubeconfig: Kind selects the new cluster's context
      # when writing it, keeping the tools and kubectl on this
      # cluster regardless of any default kubeconfig on the runner.
      KUBECONFIG: ${{ github.workspace }}/.kind/kubeconfig
      KIND_EXPERIMENTAL_PROVIDER: podman
    steps:
      - name: Check out the module source
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Generate the module definition
        run: |
          set -euo pipefail
          odh() {
            go run "github.com/lburgazzoli/odh-platform-tools/cmd@$ODH_TOOLS_REF" "$@"
          }
          if [ "$MODULE_SOURCE" = "." ]; then
            source_dir="source"
          else
            source_dir="source/$MODULE_SOURCE"
          fi
          # Optional flags are appended conditionally: the CLI
          # rejects explicit empty values, and Kustomize sources
          # reject Helm values options outright.
          args=("$source_dir" --output .generated/module.yaml)
          if [ -n "${MODULE_NAME:-}" ]; then
            args+=(--name "$MODULE_NAME")
          fi
          if [ -n "${INSTANCE_NAME:-}" ]; then
            args+=(--instance-name "$INSTANCE_NAME")
          fi
          if [ -n "${INIT_CONTAINER:-}" ]; then
            args+=(--init-container "$INIT_CONTAINER")
          fi
          if [ -n "${RELATED_IMAGES_FILE:-}" ]; then
            args+=(--related-images-file "source/$RELATED_IMAGES_FILE")
          fi
          if [ "$MANIFEST_FORMAT" = helm ]; then
            if [ -n "${HELM_VALUES_FILE:-}" ]; then
              args+=(--values-file "source/$HELM_VALUES_FILE")
            fi
            if [ -n "${HELM_SETS:-}" ]; then
              while IFS= read -r expression; do
                [ -n "$expression" ] || continue
                args+=(--values "$expression")
              done <<< "$HELM_SETS"
            fi
          fi
          # Fresh generation every run: the runner is ephemeral, so
          # .generated/module.yaml never exists yet (create-once).
          # A committed definition is never reused as the input.
          mkdir -p .generated
          odh module generate "${args[@]}"

      - name: Lint the definition
        run: |
          set -euo pipefail
          odh() {
            go run "github.com/lburgazzoli/odh-platform-tools/cmd@$ODH_TOOLS_REF" "$@"
          }
          # Failure fails the job: no go run wrapper semantics are
          # interpreted here, and nothing masks a nonzero exit.
          odh module lint --config .generated/module.yaml

      - name: Create the Kind cluster
        run: |
          set -euo pipefail
          kind_cli() {
            go run "sigs.k8s.io/kind@$KIND_REF" "$@"
          }
          mkdir -p "$(dirname "$KUBECONFIG")"
          kind_cli create cluster --name "$CLUSTER"

      - name: Install prerequisite CRDs
        run: |
          # Replace with the APIs your controller watches but does not
          # own, or delete this step when it has none. Prerequisite,
          # not convenience: without a watched CRD the controller's
          # informer never syncs — it runs but reconciles nothing.
          # Prerequisites live in your repository, checked out under
          # source/, so the cluster gets exactly what you reviewed —
          # not something fetched from elsewhere. Server-side apply
          # tolerates large CRD manifests that client-side apply
          # rejects, and waiting for Established keeps deploy from
          # racing the API.
          kubectl apply --server-side \
            --filename source/config/prerequisites/servicemonitor-crds.yaml
          kubectl wait --for=condition=Established \
            crd/servicemonitors.monitoring.coreos.com --timeout=60s

      - name: Create the target namespace
        run: kubectl create namespace "$NAMESPACE"

      - name: Deploy the controller package
        run: |
          set -euo pipefail
          odh() {
            go run "github.com/lburgazzoli/odh-platform-tools/cmd@$ODH_TOOLS_REF" "$@"
          }
          args=(
            --config .generated/module.yaml
            --platform-version "$PLATFORM_VERSION"
            --namespace "$NAMESPACE"
            --wait
          )
          if [ -n "${RELATED_IMAGES_FILE:-}" ]; then
            args+=(--related-images-file "source/$RELATED_IMAGES_FILE")
          fi
          # Not atomic, no rollback: a failed deploy can leave
          # partial writes behind. --wait covers the Deployment
          # rollout only; module readiness is proven by validate.
          odh module deploy "${args[@]}"

      - name: Apply the module instance
        run: |
          # The instance is applied separately from the controller
          # package, by design: deploy never creates the module CR.
          kubectl apply --filename "source/$INSTANCE_MANIFEST"

      - name: Validate the running module
        run: |
          set -euo pipefail
          odh() {
            go run "github.com/lburgazzoli/odh-platform-tools/cmd@$ODH_TOOLS_REF" "$@"
          }
          # Read-only, with a larger bounded budget for a cold CI
          # cluster (the default is 30s) — never an infinite retry.
          odh module validate \
            --config .generated/module.yaml \
            --namespace "$NAMESPACE" \
            --timeout 5m

      - name: Delete the Kind cluster
        run: |
          set -euo pipefail
          kind_cli() {
            go run "sigs.k8s.io/kind@$KIND_REF" "$@"
          }
          # The runner is ephemeral: on a failed run the whole
          # machine — cluster included — is discarded with it.
          kind_cli delete cluster --name "$CLUSTER"
