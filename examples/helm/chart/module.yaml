# The co-located layout: this definition file sits inside the chart
# directory, next to Chart.yaml, so the manifests entry needs no path
# — it defaults to this file's own directory.
apiVersion: config.opendatahub.io/v1alpha1
kind: PlatformModuleDefinition
metadata:
  name: example
spec:
  instance:
    name: default-example               # optional; defaults to metadata.name when omitted
    type:                               # the Module custom resource the controller owns
      group: components.platform.opendatahub.io
      version: v1alpha1
      kind: Example
  manifests:
    format: helm
    helm:
      values:                           # literal values, merged over the chart defaults
        replicas: 2
  relatedImages:
  - RELATED_IMAGE_EXAMPLE_CONTROLLER
  controller:
    deployment:
      name: example-controller
      container:
        image: quay.io/example/example-controller:v1.0.0
        env:
        - name: LOG_LEVEL
          value: debug
