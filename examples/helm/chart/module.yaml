# The manifests source defaults to this definition's directory.
apiVersion: config.opendatahub.io/v1alpha1
kind: PlatformModuleDefinition
metadata:
  name: helm-module
spec:
  instance:
    name: default-helm-module
    type:
      group: components.platform.opendatahub.io
      version: v1alpha1
      kind: HelmModule
  manifests:
    format: helm
    helm:
      values:
        replicas: 1
  relatedImages:
  - RELATED_IMAGE_MOCK_CONTROLLER
  controller:
    deployment:
      name: mock-controller
      container:
        image: "{{RELATED_IMAGE_MOCK_CONTROLLER}}"
        env:
        - name: LOG_LEVEL
          value: debug
