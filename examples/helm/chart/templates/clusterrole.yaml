apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: helm-module-mock-controller
rules:
- apiGroups: [components.platform.opendatahub.io]
  resources: [helmmodules]
  verbs: [get, list, watch]
- apiGroups: [components.platform.opendatahub.io]
  resources: [helmmodules/status]
  verbs: [get, patch, update]
# The framework records events for cluster-scoped modules in the default namespace.
- apiGroups: [events.k8s.io]
  resources: [events]
  verbs: [create, patch]
