apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: example-binding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: example-role
subjects:
- kind: ServiceAccount
  name: example-sa
  namespace: {{ .Release.Namespace }}
