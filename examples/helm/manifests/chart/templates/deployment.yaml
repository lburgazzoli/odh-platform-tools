apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-controller
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      serviceAccountName: example-sa
      containers:
      - name: manager
        image: quay.io/example/example-controller:v1.0.0
