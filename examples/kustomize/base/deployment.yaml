apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mock-controller
  template:
    metadata:
      labels:
        app: mock-controller
    spec:
      serviceAccountName: mock-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: quay.io/lburgazzoli/odh-platform-tools:dev
        imagePullPolicy: IfNotPresent
        args:
        - module
        - mock
        - --api-version=components.platform.opendatahub.io/v1alpha1
        - --kind=KustomizeModule
        - --platform-configmap=odh-kustomize-module-config
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: probes
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: probes
        readinessProbe:
          httpGet:
            path: /readyz
            port: probes
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
