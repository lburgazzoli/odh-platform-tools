# The co-located layout: this definition file sits next to
# kustomization.yaml, so the manifests entry needs no path — it
# defaults to this file's own directory.
apiVersion: config.opendatahub.io/v1alpha1
kind: PlatformModuleDefinition
metadata:
  name: example
spec:
  instance:                            # name omitted: it defaults to metadata.name
    type:
      group: components.platform.opendatahub.io
      version: v1alpha1
      kind: Example
  manifests:
    format: kustomize
  relatedImages:
  - RELATED_IMAGE_EXAMPLE_CONTROLLER
  controller:
    deployment:
      name: example-controller
      container:
        image: quay.io/example/example-controller:v1.0.0
        env:
        - name: LOG_LEVEL
          value: debug
